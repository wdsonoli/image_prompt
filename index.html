              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'slide-in-from-right': 'slide-in-from-right 0.3s ease-out forwards',

    <!-- Sistema de Iniciativa Imediata ao Toque nos Botões (Zero Atraso e 1 Único Toque) -->
    <script>
      (function() {
        var touchStartX = 0;
        var touchStartY = 0;
        var touchStartTime = 0;
        var activeCandidate = null;
        var lastActivatedTime = 0;

        document.addEventListener('touchstart', function(e) {
          if (e.touches.length !== 1) {
            activeCandidate = null;
            return;
          }
          var t = e.touches[0];
          touchStartX = t.clientX;
          touchStartY = t.clientY;
          touchStartTime = Date.now();
          activeCandidate = t.target ? (t.target.closest ? t.target.closest('button, [role="button"], input[type="button"], input[type="submit"]') : null) : null;
        }, { passive: true, capture: true });

        document.addEventListener('touchend', function(e) {
          if (!activeCandidate) return;
          var btn = activeCandidate;
          activeCandidate = null;

          if (btn.disabled || btn.getAttribute('aria-disabled') === 'true') return;

          var t = e.changedTouches ? e.changedTouches[0] : null;
          if (!t) return;

          var dx = Math.abs(t.clientX - touchStartX);
          var dy = Math.abs(t.clientY - touchStartY);
          var dt = Date.now() - touchStartTime;

          // Se foi um toque rápido (menos de 450ms) e sem arrastar (tolerância de até 22px para movimentos naturais do polegar)
          if (dt < 450 && dx < 22 && dy < 22) {
            var now = Date.now();
            if (now - lastActivatedTime < 80) return;
            lastActivatedTime = now;

            try {
              if (typeof btn.focus === 'function') {
                btn.focus();
              }
            } catch (err) {}

            var nativeFired = false;
            var markNative = function() {
              nativeFired = true;
              btn.removeEventListener('click', markNative, true);
            };
            btn.addEventListener('click', markNative, true);

            setTimeout(function() {
              btn.removeEventListener('click', markNative, true);
              if (!nativeFired && !btn.disabled) {
                try {
                  btn.click();
                } catch (e) {}
              }
            }, 30);
          }
        }, { passive: true, capture: true });
      })();
    </script>
